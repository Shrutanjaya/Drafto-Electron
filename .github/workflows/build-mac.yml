name: Build macOS Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload DMG to (e.g. v1.0.23)'
        required: true
        type: string
        default: 'v1.0.23'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Drafto-Electron
        uses: actions/checkout@v4
        with:
          path: Drafto-Electron

      - name: Checkout Firebase Files (v1Drafto)
        uses: actions/checkout@v4
        with:
          repository: Shrutanjaya/v1Drafto
          token: ${{ secrets.GH_PAT }}
          path: Firebase Files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.production
        run: |
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyANHtnyFUEJiKQhQQykZJhtU4jzKLeZRBs"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=draftoslp.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=draftoslp"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=draftoslp.firebasestorage.app"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=109929006113"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:109929006113:web:1c180e213b9b9cf33bcf60"
          } > "Firebase Files/.env.production"

      - name: Install Firebase Files dependencies
        working-directory: Firebase Files
        run: npm install

      - name: Build Next.js app
        working-directory: Firebase Files
        run: npm run build

      - name: Install Drafto-Electron dependencies
        working-directory: Drafto-Electron
        run: npm install

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

      - name: Create entitlements plist
        working-directory: Drafto-Electron
        run: |
          mkdir -p build
          cat > build/entitlements.mac.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key>
              <true/>
            </dict>
          </plist>
          EOF

      - name: Write API key file for notarization
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Build macOS DMG (signed)
        working-directory: Drafto-Electron
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ../certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Submit to Apple notarization
        id: notarize_submit
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_FILE="AuthKey_${APPLE_API_KEY_ID}.p8"
          DMG_PATH=$(ls Drafto-Electron/dist/*.dmg | head -1)
          echo "Submitting $DMG_PATH for notarization..."
          SUBMISSION_ID=$(xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT

      - name: Wait for notarization to complete
        timeout-minutes: 90
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SUBMISSION_ID: ${{ steps.notarize_submit.outputs.submission_id }}
        run: |
          KEY_FILE="AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "Polling submission $SUBMISSION_ID..."
          for i in $(seq 1 180); do
            sleep 30
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$KEY_FILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --output-format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "network_error")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization accepted!"
              exit 0
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization failed with status: $STATUS"
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" 2>/dev/null || true
              exit 1
            fi
            echo "Still processing, waiting 30s..."
          done
          echo "Timed out waiting for notarization"
          exit 1

      - name: Staple notarization ticket to DMG
        run: |
          DMG_PATH=$(ls Drafto-Electron/dist/*.dmg | head -1)
          xcrun stapler staple "$DMG_PATH"
          echo "Stapling complete: $DMG_PATH"

      - name: Upload DMG to GitHub Release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          gh release upload "$RELEASE_TAG" Drafto-Electron/dist/*.dmg --clobber --repo Shrutanjaya/Drafto-Electron
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
