name: Build macOS Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload DMG to (e.g. v1.0.23)'
        required: true
        type: string
        default: 'v1.0.23'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Drafto-Electron
        uses: actions/checkout@v4
        with:
          path: Drafto-Electron

      - name: Checkout Firebase Files (v1Drafto)
        uses: actions/checkout@v4
        with:
          repository: Shrutanjaya/v1Drafto
          token: ${{ secrets.GH_PAT }}
          path: Firebase Files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.production
        run: |
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyANHtnyFUEJiKQhQQykZJhtU4jzKLeZRBs"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=draftoslp.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=draftoslp"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=draftoslp.firebasestorage.app"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=109929006113"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:109929006113:web:1c180e213b9b9cf33bcf60"
          } > "Firebase Files/.env.production"

      - name: Install Firebase Files dependencies
        working-directory: Firebase Files
        run: npm install

      - name: Build Next.js app
        working-directory: Firebase Files
        run: npm run build

      - name: Remove native modules not needed at runtime
        run: |
          # sharp / @img are installed by Next.js for image optimisation but the
          # standalone server does not need them.  Their presence adds large
          # platform-specific binaries that dramatically slow Apple's notarisation.
          rm -rf "Firebase Files/.next/standalone/node_modules/sharp"
          rm -rf "Firebase Files/.next/standalone/node_modules/@img"
          # Next.js SWC compiler is build-time only; remove if it crept in
          find "Firebase Files/.next/standalone/node_modules" -maxdepth 3 \
            -name "*.node" -path "*swc*" -delete 2>/dev/null || true
          echo "Native .node files remaining in standalone:"
          find "Firebase Files/.next/standalone/node_modules" -name "*.node" \
            2>/dev/null || echo "  (none)"

      - name: Install Drafto-Electron dependencies
        working-directory: Drafto-Electron
        run: npm install

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

      - name: Create entitlements plist
        working-directory: Drafto-Electron
        run: |
          mkdir -p build
          cat > build/entitlements.mac.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
            </dict>
          </plist>
          EOF

      - name: Write API key file for notarization
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Build macOS DMG (signed)
        working-directory: Drafto-Electron
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ../certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple DMG
        timeout-minutes: 120
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_FILE="AuthKey_${APPLE_API_KEY_ID}.p8"
          DMG_PATH=$(ls Drafto-Electron/dist/*.dmg | head -1)
          echo "Notarizing: $DMG_PATH"

          # Submit and block until Apple finishes (or step times out at 120 min).
          # --output-format json gives a single JSON object on completion.
          NOTARIZE_JSON=$(xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json 2>&1)

          echo "--- notarytool output ---"
          echo "$NOTARIZE_JSON"
          echo "-------------------------"

          SUBMISSION_ID=$(echo "$NOTARIZE_JSON" | \
            python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('id',''))" 2>/dev/null || echo "")
          STATUS=$(echo "$NOTARIZE_JSON" | \
            python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")

          echo "Submission ID : $SUBMISSION_ID"
          echo "Final status  : $STATUS"

          if [ "$STATUS" = "Accepted" ]; then
            echo "Apple notarization accepted. Stapling ticket..."
            xcrun stapler staple "$DMG_PATH"
            echo "Stapling complete."
          else
            echo "ERROR: Notarization status is '$STATUS' (expected 'Accepted')."
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching Apple's detailed notarization log..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" 2>&1 || echo "(log unavailable)"
            fi
            exit 1
          fi

      - name: Upload DMG to GitHub Release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          gh release upload "$RELEASE_TAG" Drafto-Electron/dist/*.dmg --clobber --repo Shrutanjaya/Drafto-Electron
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
