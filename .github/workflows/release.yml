name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # LibreOffice is downloaded straight from The Document Foundation rather
      # than through Homebrew. The cask pins a point release, and the mirror
      # DELETES a point release as soon as the next one lands — so the build
      # broke on a 404 for a version nobody chose, and could only be fixed by
      # waiting for Homebrew to catch up. This asks the mirror which versions
      # exist right now and takes the newest, so the build breaks only when we
      # decide to change version. Set LIBREOFFICE_VERSION to pin one.
      - name: Install LibreOffice
        run: |
          set -euo pipefail
          VER="${LIBREOFFICE_VERSION:-}"
          if [ -z "$VER" ]; then
            VER=$(curl -sSfL https://download.documentfoundation.org/libreoffice/stable/ \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+/' | tr -d '/' | sort -V | tail -1)
          fi
          [ -n "$VER" ] || { echo "Could not work out a LibreOffice version"; exit 1; }
          DMG="LibreOffice_${VER}_MacOS_aarch64.dmg"
          URL="https://download.documentfoundation.org/libreoffice/stable/${VER}/mac/aarch64/${DMG}"
          echo "Installing LibreOffice $VER from $URL"
          for attempt in 1 2 3; do
            if curl -fSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/$DMG" "$URL"; then break; fi
            echo "download attempt $attempt failed"
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -quiet -mountpoint "$MOUNT" "$RUNNER_TEMP/$DMG"
          # ditto, not cp: LibreOffice.app is a bundle of symlinks and nested
          # frameworks that a plain copy corrupts (see beforePack.js).
          ditto "$MOUNT/LibreOffice.app" /Applications/LibreOffice.app
          hdiutil detach "$MOUNT" -quiet
          rm -f "$RUNNER_TEMP/$DMG"
          test -x /Applications/LibreOffice.app/Contents/MacOS/soffice
          echo "LibreOffice $VER installed"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm /tmp/certificate.p12

      - name: Write Apple API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: echo "$APPLE_API_KEY_CONTENT" | base64 --decode > /tmp/AuthKey.p8

      - name: Build and package Mac DMG
        env:
          VITE_FIREBASE_API_KEY: AIzaSyANHtnyFUEJiKQhQQykZJhtU4jzKLeZRBs
          VITE_FIREBASE_AUTH_DOMAIN: draftoslp.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: draftoslp
          VITE_FIREBASE_STORAGE_BUCKET: draftoslp.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "109929006113"
          VITE_FIREBASE_APP_ID: "1:109929006113:web:1c180e213b9b9cf33bcf60"
          # Feature flags for the release build.
          #
          # ENTITLEMENT switches on subscription enforcement and device seats:
          # a lapsed subscription becomes read-only (view and copy, but no
          # editing or generation), and document types outside the customer's
          # plan are shown locked rather than hidden. Off, the app behaves as it
          # did before that layer existed and nobody's access changes.
          VITE_ENABLE_WP: "true"
          VITE_ENABLE_OA: "true"
          VITE_ENABLE_ENTITLEMENT: "true"
          APPLE_API_KEY: /tmp/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The DMG packaging step (hdiutil) intermittently fails on GitHub macOS
        # runners with "hdiutil: create failed - Device not configured". The app
        # build, signing and notarization all succeed; only the disk-image
        # creation flakes. Retry the electron-builder run a few times so a
        # transient hdiutil failure doesn't sink the whole release.
        run: |
          npm run build
          for attempt in 1 2 3; do
            echo "::group::electron-builder --mac (attempt $attempt)"
            if npx electron-builder --mac --publish always; then
              echo "::endgroup::"
              echo "mac build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            sleep 30
          done
          echo "mac build failed after 3 attempts"
          exit 1

      - name: Clean up Apple API key
        if: always()
        run: rm -f /tmp/AuthKey.p8

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      # Downloaded from The Document Foundation rather than through Chocolatey,
      # for the reason given on the Mac job: the packaged version is pinned, and
      # the mirror deletes a point release as soon as the next one lands, so the
      # build failed on a file nobody had chosen. The retry is kept — the
      # mirror's redirector does also refuse connections now and then.
      - name: Install LibreOffice (bundled as PDF-conversion fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:LIBREOFFICE_VERSION
          if (-not $ver) {
            $listing = (Invoke-WebRequest -UseBasicParsing 'https://download.documentfoundation.org/libreoffice/stable/').Content
            $ver = [regex]::Matches($listing, '(\d+\.\d+\.\d+)/') |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object { [version]$_ } -Unique |
              Select-Object -Last 1
          }
          if (-not $ver) { Write-Host 'Could not work out a LibreOffice version'; exit 1 }
          $msi = "LibreOffice_${ver}_Win_x86-64.msi"
          $url = "https://download.documentfoundation.org/libreoffice/stable/$ver/win/x86_64/$msi"
          $out = Join-Path $env:RUNNER_TEMP $msi
          Write-Host "Installing LibreOffice $ver from $url"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $out
              break
            } catch {
              Write-Host "download attempt $i failed: $($_.Exception.Message)"
              if ($i -eq 3) { exit 1 }
              Start-Sleep -Seconds 30
            }
          }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$out`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "msiexec exited $($p.ExitCode)"; exit 1 }
          Remove-Item $out -Force
          if (-not (Test-Path 'C:\Program Files\LibreOffice\program\soffice.exe')) {
            Write-Host 'LibreOffice did not install where the packager expects it'
            exit 1
          }
          Write-Host "LibreOffice $ver installed"

      - name: Bundle Python dependencies
        run: .\bundle-deps-win.ps1
        shell: pwsh

      # `canvas` is an OPTIONAL dependency of pdfjs-dist that we never use (our
      # PDF code uses the browser <canvas>, and the Node side only extracts text).
      # It's a native module that needs Cairo to compile, which the Windows runner
      # lacks — electron-builder's native rebuild fails on `cairo.h`. Remove it so
      # the rebuild skips it; pdfjs treats it as optional and works without it.
      - name: Remove unused optional native dep (canvas)
        run: if (Test-Path node_modules/canvas) { Remove-Item -Recurse -Force node_modules/canvas }
        shell: pwsh

      - name: Build and package Windows installer
        env:
          VITE_FIREBASE_API_KEY: AIzaSyANHtnyFUEJiKQhQQykZJhtU4jzKLeZRBs
          VITE_FIREBASE_AUTH_DOMAIN: draftoslp.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: draftoslp
          VITE_FIREBASE_STORAGE_BUCKET: draftoslp.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "109929006113"
          VITE_FIREBASE_APP_ID: "1:109929006113:web:1c180e213b9b9cf33bcf60"
          # Feature flags for the release build.
          #
          # ENTITLEMENT switches on subscription enforcement and device seats:
          # a lapsed subscription becomes read-only (view and copy, but no
          # editing or generation), and document types outside the customer's
          # plan are shown locked rather than hidden. Off, the app behaves as it
          # did before that layer existed and nobody's access changes.
          VITE_ENABLE_WP: "true"
          VITE_ENABLE_OA: "true"
          VITE_ENABLE_ENTITLEMENT: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --publish always

  # Auto-publish is DISABLED. electron-builder uploads the .dmg/.exe assets to a
  # *draft* GitHub release; the release is left as a draft so it never reaches
  # customers automatically. Review and publish it manually from the GitHub
  # Releases page when it is ready to ship.
  #
  # (To re-enable auto-publishing later, restore a `publish` job that runs
  #  `gh release edit "$TAG" --draft=false --latest`.)
